<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · Calcul mental</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17384d;background:#eef8fc}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1000px;margin:auto}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #174b6920;margin-bottom:20px}.hidden{display:none!important}h1,h2{margin-top:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}button{border:2px solid #147fc1;border-radius:16px;background:#269ee8;color:white;padding:11px 16px;font-weight:800;font-size:16px;box-shadow:0 4px 0 #116da5;cursor:pointer}button.secondary{background:white;color:#245d80;border-color:#b8d8e8;box-shadow:none}.classes{display:flex;gap:12px;flex-wrap:wrap}.classes button{min-width:100px}.level-list{display:flex;flex-direction:column;gap:10px;margin-top:18px}.level-item{display:flex;align-items:center;gap:8px}.level-open{flex:1;text-align:left}.move{width:44px;padding:10px}.manager-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin:14px 0}.manager-row label,.session-settings label{display:flex;flex-direction:column;gap:5px;font-weight:700}input,select{font:inherit;padding:9px;border:1px solid #b9d3df;border-radius:10px}.error{color:#b12626;font-weight:700;margin-top:10px}.session-settings{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}.config-row{border-top:1px solid #dcebf2;padding:15px 0;display:grid;grid-template-columns:minmax(180px,1fr) 110px 2fr;gap:12px;align-items:start}.params{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.params label{font-size:14px}.params input[type=text]{width:70px}.tables{display:flex;gap:5px;flex-wrap:wrap}.tables label{font-weight:500}.config-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.total{font-weight:800}.danger{background:#fff;color:#b12626;border-color:#e4aaaa;box-shadow:none}@media(max-width:650px){body{padding:12px}.card{padding:16px}.manager-row{grid-template-columns:1fr}.config-row{grid-template-columns:1fr}.level-item{flex-wrap:wrap}}
</style></head><body><main>
<section id="adminHome" class="card"><h1>Administration</h1><button id="manageLevels">Gérer les niveaux</button></section>
<section id="classesView" class="card hidden"><div class="top"><h2>Gérer les niveaux</h2><button class="secondary" data-back="home">Retour</button></div><div id="classes" class="classes"></div></section>
<section id="levelsView" class="card hidden"><div class="top"><h2 id="classTitle"></h2><button class="secondary" data-back="classes">Retour</button></div><button id="manageList">＋ Ajouter / gérer les niveaux</button><div id="levelList" class="level-list"></div></section>
<section id="managerView" class="card hidden"><div class="top"><h2 id="managerTitle">Ajouter / gérer les niveaux</h2><button class="secondary" data-back="levels">Retour</button></div><div class="manager-row"><label>Nom du nouveau niveau<input id="newName"></label><label>Recopier la configuration depuis<select id="copyFrom"><option value="">Configuration vide</option></select></label><button id="addLevel">Ajouter</button></div><div id="managerList" class="level-list"></div><div id="managerErr" class="error"></div></section>
<section id="configView" class="card hidden"><div class="top"><div><small id="configClass"></small><h2><input id="levelName" style="font-size:1em;font-weight:800"></h2></div><button class="secondary" data-back="levels">Retour</button></div><div class="config-actions"><button id="saveLevel">Enregistrer</button><span class="total">Total actif : <span id="totalPct">0</span> %</span><button id="allocate" class="secondary">Affecter</button></div><div id="configErr" class="error"></div><div class="session-settings"><label>Temps (minutes)<input id="durationMinutes" type="number" min="1" max="60"></label><label>Nombre de questions<input id="questionCount" type="number" min="1" max="500"></label></div><div id="configRows"></div></section>
</main><script src="/static/config-form.js"></script><script>
const $=s=>document.querySelector(s), classes=['CP','CE1','CE2','CM1','CM2'];let currentClass=null,levels=[],current=null,cfg=null;
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt}),j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}
function show(id){['adminHome','classesView','levelsView','managerView','configView'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
async function ensureAuth(){let s=await api('/api/auth/status');if(!s.authenticated){location.href='/';return false}return true}
async function loadLevels(){levels=await api('/api/admin/levels')}
function classButtons(){let r=$('#classes');r.innerHTML='';classes.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>openClass(c);r.appendChild(b)})}
async function openClass(c){currentClass=c;await loadLevels();$('#classTitle').textContent=c;renderLevelList();show('levelsView')}
function renderLevelList(){let arr=levels.filter(x=>x.school_class===currentClass).sort((a,b)=>a.position-b.position),r=$('#levelList');r.innerHTML='';arr.forEach((x,i)=>{let d=document.createElement('div');d.className='level-item';d.innerHTML=`<button class="level-open">${x.name}</button><button class="move" title="Monter">↑</button><button class="move" title="Descendre">↓</button>`;d.children[0].onclick=()=>openConfig(x.id);d.children[1].onclick=()=>move(x.id,'up');d.children[2].onclick=()=>move(x.id,'down');d.children[1].disabled=i===0;d.children[2].disabled=i===arr.length-1;r.appendChild(d)})}
async function move(id,direction){await api('/api/admin/levels/'+id+'/move',{method:'POST',body:JSON.stringify({direction})});await openClass(currentClass)}
$('#manageLevels').onclick=async()=>{await loadLevels();classButtons();show('classesView')};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{let x=b.dataset.back;show(x==='home'?'adminHome':x==='classes'?'classesView':'levelsView')});
$('#manageList').onclick=()=>{renderManager();show('managerView')};
function renderManager(){let sel=$('#copyFrom');sel.innerHTML='<option value="">Configuration vide</option>'+levels.map(x=>`<option value="${x.id}">${x.school_class} · ${x.name}</option>`).join('');let r=$('#managerList');r.innerHTML='';levels.filter(x=>x.school_class===currentClass).sort((a,b)=>a.position-b.position).forEach(x=>{let d=document.createElement('div');d.className='level-item';d.innerHTML=`<button class="level-open">${x.name}</button><button class="danger">Supprimer</button>`;d.children[0].onclick=()=>openConfig(x.id);d.children[1].onclick=async()=>{if(confirm('Supprimer « '+x.name+' » ?')){await api('/api/admin/levels/'+x.id,{method:'DELETE'});await loadLevels();renderManager()}};r.appendChild(d)})}
$('#addLevel').onclick=async()=>{try{await api('/api/admin/levels',{method:'POST',body:JSON.stringify({school_class:currentClass,name:$('#newName').value,copy_from:$('#copyFrom').value||null})});$('#newName').value='';await loadLevels();renderManager();$('#managerErr').textContent=''}catch(e){$('#managerErr').textContent=e.message}};
async function openConfig(id){current=await api('/api/admin/levels/'+id);cfg=current.config;$('#configClass').textContent=current.school_class;$('#levelName').value=current.name;$('#durationMinutes').value=Math.round(cfg.duration/60);$('#questionCount').value=cfg.count;ConfigForm.render($('#configRows'),cfg);wireRows();updateTotal();show('configView')}
function updateTotal(){let rows=[...$('#configRows').querySelectorAll('.config-row')],total=rows.reduce((s,r)=>s+(r.querySelector('.enabled').checked?(+r.querySelector('.pct').value||0):0),0);$('#totalPct').textContent=total;$('#allocate').disabled=!(rows.some(r=>r.querySelector('.enabled').checked)&&total<100)}
function wireRows(){$('#configRows').oninput=e=>{if(e.target.classList.contains('enabled')){let p=e.target.closest('.config-row').querySelector('.pct');if(!e.target.checked){p.value=0;p.disabled=true}else p.disabled=false}updateTotal()}}
$('#allocate').onclick=()=>{let rows=[...$('#configRows').querySelectorAll('.config-row')].filter(r=>r.querySelector('.enabled').checked),total=rows.reduce((s,r)=>s+(+r.querySelector('.pct').value||0),0),rem=100-total;if(!rows.length||rem<=0)return;let each=Math.floor(rem/rows.length),extra=rem%rows.length;rows.forEach((r,i)=>r.querySelector('.pct').value=(+r.querySelector('.pct').value||0)+each+(i<extra?1:0));updateTotal()};
$('#saveLevel').onclick=async()=>{let rows=[...$('#configRows').querySelectorAll('.config-row')],total=rows.reduce((s,r)=>s+(r.querySelector('.enabled').checked?(+r.querySelector('.pct').value||0):0),0);if(total!==100){$('#configErr').textContent='Total actif doit être 100%';return}cfg.duration=Math.max(60,(+$('#durationMinutes').value||5)*60);cfg.count=Math.max(1,+$('#questionCount').value||50);ConfigForm.collect($('#configRows'),cfg);try{await api('/api/admin/levels/'+current.id,{method:'PUT',body:JSON.stringify({name:$('#levelName').value,config:cfg})});$('#configErr').textContent='';await openClass(currentClass)}catch(e){$('#configErr').textContent=e.message}};
(async()=>{if(await ensureAuth()){classButtons()}})();
</script></body></html>
