const $=s=>document.querySelector(s), classes=['CP','CE1','CE2','CM1','CM2'];let currentClass=null,levels=[],current=null,cfg=null;
const HELP_CATALOG=[
['addition','Additions',[['Passage par 10','Décompose le second nombre pour atteindre la dizaine ronde, puis ajoute le reste.'],['Décomposition','Sépare dizaines et unités et ajoute-les successivement.']]],
['subtraction','Soustractions',[['Passage par la dizaine','Descends d’abord jusqu’à la dizaine ronde, puis enlève le reste.'],['Décomposition','Enlève d’abord les dizaines, puis les unités.']]],
['double','Doubles',[['Petit nombre','Présente le double comme le nombre ajouté à lui-même.'],['Nombre à 2 chiffres','Écris par exemple 15 + 15 = (10 + 5) + (10 + 5) = 10 + 10 + 5 + 5 = double de 10 + double de 5, puis additionne les deux doubles.']]],
['half','Moitiés',[['Partage','Montre deux parts égales.'],['Nombre à 2 chiffres','Décompose en morceaux pairs puis partage chaque morceau par 2.']]],
['complement10','Compléments à 10',[['Complément','Montre le chemin du nombre jusqu’à 10 et ce qu’il manque.']]],
['multiplication','Multiplications',[['× 4','Double deux fois.'],['× 5','Prends la moitié de ×10.'],['× 6, 7, 8','Pars de ×5 puis ajoute les groupes restants.'],['× 9','Fais ×10 puis retire une fois le nombre.'],['× 10 / 100 / 1000','Pour un entier, ajoute 1 / 2 / 3 zéros à droite.'],['Autres','Représente des groupes égaux.']]],
['tens','Ajout de dizaines',[['Dizaines / unités','Ajoute seulement les dizaines ; les unités restent inchangées.']]],
['tens_sub','Soustraction de dizaines',[['Dizaines / unités','Enlève seulement les dizaines ; les unités restent inchangées.']]],
['double_tens','Double de dizaines',[['Décomposition','Écris le nombre comme dizaines + unités, puis transforme n + n en double des dizaines + double des unités.']]],
['half_tens','Moitié de dizaine',[['Partage','Partage les dizaines en deux parts égales.']]],
['division','Divisions',[['Multiplication inverse','Transforme a ÷ b en b × ? = a et cherche dans la table.']]],
['decimal','Additions décimales',[['Valeur de position','Aligne unités, dixièmes, centièmes et calcule colonne par colonne.']]],
['decimal_sub','Soustractions décimales',[['Valeur de position','Aligne unités, dixièmes, centièmes et calcule colonne par colonne.']]],
['decimal_multiplication','Multiplications décimales',[['× 10','Déplace la virgule 1 fois vers la droite.'],['× 100','Déplace la virgule 2 fois vers la droite.'],['× 1000','Déplace la virgule 3 fois vers la droite.']]],
['decimal_division','Divisions décimales',[['÷ 10','Déplace la virgule 1 fois vers la gauche.'],['÷ 100','Déplace la virgule 2 fois vers la gauche.'],['÷ 1000','Déplace la virgule 3 fois vers la gauche.']]]
];
function renderHelpCatalog(){
  $('#helpCatalog').innerHTML=HELP_CATALOG.map(([id,name,cases])=>`<article class="help-card"><h3>${name}</h3><div class="help-id">${id}</div>${cases.map(([title,text])=>`<div class="help-case"><strong>${title}</strong><div class="help-aid">🟢 <b>Aide :</b> ${text}<br><small>Utilise un autre calcul généré avec les mêmes réglages.</small></div><div class="help-correction">🟠 <b>Correction :</b> ${text}<br><small>Appliqué au vrai calcul de l’enfant.</small></div></div>`).join('')}</article>`).join('');
}

async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt}),j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}
function show(id){['adminHome','helpView','classesView','levelsView','managerView','configView'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
async function ensureAuth(){let s=await api('/api/auth/status');if(!s.authenticated){location.href='/';return false}return true}
async function loadLevels(){levels=await api('/api/admin/levels')}
function classButtons(){let r=$('#classes');r.innerHTML='';classes.forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>openClass(c);r.appendChild(b)})}
async function openClass(c){currentClass=c;await loadLevels();$('#classTitle').textContent=c;renderLevelList();show('levelsView')}
function renderLevelList(){let arr=levels.filter(x=>x.school_class===currentClass).sort((a,b)=>a.position-b.position),r=$('#levelList');r.innerHTML='';arr.forEach((x,i)=>{let d=document.createElement('div');d.className='level-item';d.innerHTML=`<button class="level-open">${x.name}</button><button class="move" title="Monter">↑</button><button class="move" title="Descendre">↓</button>`;d.children[0].onclick=()=>openConfig(x.id);d.children[1].onclick=()=>move(x.id,'up');d.children[2].onclick=()=>move(x.id,'down');d.children[1].disabled=i===0;d.children[2].disabled=i===arr.length-1;r.appendChild(d)})}
async function move(id,direction){await api('/api/admin/levels/'+id+'/move',{method:'POST',body:JSON.stringify({direction})});await openClass(currentClass)}
$('#manageLevels').onclick=async()=>{await loadLevels();classButtons();show('classesView')};
$('#manageHelp').onclick=()=>{renderHelpCatalog();show('helpView')};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=()=>{let x=b.dataset.back;show(x==='home'?'adminHome':x==='classes'?'classesView':'levelsView')});
$('#manageList').onclick=()=>{renderManager();show('managerView')};
function renderManager(){let sel=$('#copyFrom');sel.innerHTML='<option value="">Configuration vide</option>'+levels.map(x=>`<option value="${x.id}">${x.school_class} · ${x.name}</option>`).join('');let r=$('#managerList');r.innerHTML='';levels.filter(x=>x.school_class===currentClass).sort((a,b)=>a.position-b.position).forEach(x=>{let d=document.createElement('div');d.className='level-item';d.innerHTML=`<button class="level-open">${x.name}</button><button class="danger">Supprimer</button>`;d.children[0].onclick=()=>openConfig(x.id);d.children[1].onclick=async()=>{if(confirm('Supprimer « '+x.name+' » ?')){await api('/api/admin/levels/'+x.id,{method:'DELETE'});await loadLevels();renderManager()}};r.appendChild(d)})}
$('#addLevel').onclick=async()=>{try{await api('/api/admin/levels',{method:'POST',body:JSON.stringify({school_class:currentClass,name:$('#newName').value,copy_from:$('#copyFrom').value||null})});$('#newName').value='';await loadLevels();renderManager();$('#managerErr').textContent=''}catch(e){$('#managerErr').textContent=e.message}};
async function openConfig(id){
  try{
    current=await api('/api/admin/levels/'+id);
    cfg=current.config;
    $('#configClass').textContent=current.school_class;
    $('#levelName').value=current.name;
    $('#durationMinutes').value=Math.round(cfg.duration/60);
    $('#questionCount').value=cfg.count;
    ConfigForm.render($('#configRows'),cfg);
    $('#configErr').textContent='';
    show('configView');
  }catch(e){
    const box=$('#managerErr'); if(box) box.textContent='Impossible d’ouvrir le niveau : '+e.message;
    alert('Impossible d’ouvrir le niveau : '+e.message);
  }
}
$('#questionCount').addEventListener('change',()=>{if(!cfg)return;cfg.count=Math.max(1,Math.min(500,+$('#questionCount').value||50));ConfigForm.render($('#configRows'),cfg)});
$('#saveLevel').onclick=async()=>{cfg.duration=Math.max(60,(+$('#durationMinutes').value||5)*60);cfg.count=Math.max(1,+$('#questionCount').value||50);ConfigForm.collect($('#configRows'),cfg);if(!Object.values(cfg.categories).some(v=>v.enabled)){ $('#configErr').textContent='Sélectionne au moins un type d’exercice.';return }try{await api('/api/admin/levels/'+current.id,{method:'PUT',body:JSON.stringify({name:$('#levelName').value,config:cfg})});$('#configErr').textContent='';await openClass(currentClass)}catch(e){$('#configErr').textContent=e.message}};
(async()=>{if(await ensureAuth()){classButtons()}})();
</script></body></html>
