<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration · Calcul mental</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#17384d;background:#eef8fc}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1000px;margin:auto}.card{background:#fff;border-radius:22px;padding:24px;box-shadow:0 8px 28px #174b6920;margin-bottom:20px}.hidden{display:none!important}h1,h2{margin-top:0}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}button{border:2px solid #147fc1;border-radius:16px;background:#269ee8;color:white;padding:11px 16px;font-weight:800;font-size:16px;box-shadow:0 4px 0 #116da5;cursor:pointer}button.secondary{background:white;color:#245d80;border-color:#b8d8e8;box-shadow:none}.classes{display:flex;gap:12px;flex-wrap:wrap}.classes button{min-width:100px}.class-color-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 6px;padding:12px 14px;border:1px solid #d5e7ef;border-radius:15px;background:#f8fcfe}.class-color-row input[type=color]{width:58px;height:42px;padding:2px;border-radius:10px;cursor:pointer}.class-color-preview{width:34px;height:34px;border-radius:50%;box-shadow:inset 0 -3px 0 #0002,0 2px 5px #0002}.level-list{display:flex;flex-direction:column;gap:10px;margin-top:18px}.level-item{display:flex;align-items:center;gap:8px}.level-open{flex:1;text-align:left}.move{width:44px;padding:10px}.manager-row{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;margin:14px 0}.manager-row label,.session-settings label{display:flex;flex-direction:column;gap:5px;font-weight:700}input,select{font:inherit;padding:9px;border:1px solid #b9d3df;border-radius:10px}.error{color:#b12626;font-weight:700;margin-top:10px}.session-settings{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0}.config-row{border-top:1px solid #dcebf2;padding:15px 0;display:grid;grid-template-columns:minmax(180px,1fr) 110px 2fr;gap:12px;align-items:start}.params{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.params label{font-size:14px}.params input[type=text]{width:70px}.tables{display:flex;gap:5px;flex-wrap:wrap}.tables label{font-weight:500}.config-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.total{font-weight:800}.danger{background:#fff;color:#b12626;border-color:#e4aaaa;box-shadow:none}@media(max-width:650px){body{padding:12px}.card{padding:16px}.manager-row{grid-template-columns:1fr}.config-row{grid-template-columns:1fr}.level-item{flex-wrap:wrap}}

/* Liste des niveaux : compacte, centrée et lisible */
#levelsView{max-width:820px;margin-left:auto;margin-right:auto}
#levelsView #manageList{display:block;margin:16px auto 4px}
#levelList{max-width:600px;margin:18px auto 0}
#levelList .level-item{
  width:100%;box-sizing:border-box;padding:7px;
  border:1px solid #d8e7ef;border-radius:14px;background:#fafdff;
  box-shadow:0 2px 8px rgba(30,80,110,.06);gap:7px
}
#levelList .level-open{
  min-width:0;padding:10px 14px;border-radius:10px;
  font-size:16px;text-align:center
}
#levelList .move{
  flex:0 0 38px;width:38px;height:38px;padding:0;
  display:grid;place-items:center;border-radius:10px
}
#levelList .move:disabled{opacity:.32;box-shadow:none}
#managerView{max-width:820px;margin-left:auto;margin-right:auto}
#managerList{max-width:600px;margin-left:auto;margin-right:auto}
#managerList .level-item{
  width:100%;box-sizing:border-box;padding:7px;
  border:1px solid #d8e7ef;border-radius:14px;background:#fafdff;
  box-shadow:0 2px 8px rgba(30,80,110,.06)
}
#managerList .level-open{text-align:center;min-width:0}
@media(max-width:650px){
  #levelList,#managerList{max-width:100%}
  #levelList .level-item,#managerList .level-item{flex-wrap:nowrap}
  #levelList .level-open{font-size:15px;padding:9px 7px}
  #levelList .move{flex-basis:34px;width:34px;height:34px}
}


.help-catalog{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:18px}.help-card{border:1px solid #cfe3ed;border-radius:18px;padding:16px;background:#f9fdff}.help-card h3{margin:0 0 4px}.help-id{font:12px ui-monospace,SFMono-Regular,monospace;color:#718b9b;margin-bottom:12px}.help-case{border-top:1px solid #dcebf2;padding-top:10px;margin-top:10px}.help-case strong{display:block;margin-bottom:5px}.help-aid{background:#edf9f1;border-radius:10px;padding:8px 10px;margin:5px 0}.help-correction{background:#fff6e8;border-radius:10px;padding:8px 10px;margin:5px 0}.help-legend{display:flex;gap:10px;flex-wrap:wrap;color:#5a7890;font-size:14px}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}

.level-active-toggle{display:flex;align-items:center;gap:7px;padding:0 12px;font-weight:800;color:#245b7b;white-space:nowrap;cursor:pointer}
.level-active-toggle input{width:22px;height:22px;accent-color:#20b95a;cursor:pointer}
@media(max-width:650px){.level-active-toggle{padding:0 6px;font-size:14px}.level-active-toggle input{width:20px;height:20px}}
.level-delete{padding-left:12px!important;padding-right:12px!important}
@media(max-width:800px){.level-delete{font-size:13px!important;padding-left:8px!important;padding-right:8px!important}}

.levels-transfer{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0 16px}
.levels-transfer button{width:auto}
#levelsTransferMsg{font-weight:700;color:#16803a}
</style><script src="/pedagogy.js?v=242"></script></head><body><main>
<section id="adminHome" class="card"><h1>Administration</h1><div class="admin-actions"><button id="manageLevels">Gérer les niveaux</button><button id="manageHelp">🐶 Aides pédagogiques</button></div></section>
<section id="helpView" class="card hidden"><div class="top"><div><h2>Arbre pédagogique</h2><div class="help-legend"><span>Une seule méthode par cas pédagogique.</span><span><b>Aide</b> = autre exemple du même cas · <b>Correction</b> = calcul de la question.</span></div></div><button class="secondary" data-back="home">Retour</button></div><div id="helpCatalog" class="help-catalog"></div></section>
<section id="classesView" class="card hidden"><div class="top"><h2>Gérer les niveaux</h2><button class="secondary" data-back="home">Retour</button></div><div class="levels-transfer"><button id="exportLevels" class="secondary">Exporter tous les niveaux</button><button id="importLevels" class="secondary">Importer des niveaux</button><input id="importLevelsFile" type="file" accept="application/json,.json" hidden><span id="levelsTransferMsg"></span></div><div id="classes" class="classes"></div></section>
<section id="levelsView" class="card hidden"><div class="top"><h2 id="classTitle"></h2><button class="secondary" data-back="classes">Retour</button></div><div class="class-color-row"><strong>Couleur affichée à l’enfant</strong><span id="classColorPreview" class="class-color-preview"></span><input id="classColor" type="color" aria-label="Couleur de la classe"><span id="classColorSaved" style="color:#16803a;font-weight:700"></span></div><button id="manageList">＋ Ajouter / gérer les niveaux</button><div id="levelList" class="level-list"></div></section>
<section id="managerView" class="card hidden"><div class="top"><h2 id="managerTitle">Ajouter / gérer les niveaux</h2><button class="secondary" data-back="levels">Retour</button></div><div class="manager-row"><label>Nom du nouveau niveau<input id="newName"></label><label>Recopier la configuration depuis<select id="copyFrom"><option value="">Configuration vide</option></select></label><button id="addLevel">Ajouter</button></div><div id="managerList" class="level-list"></div><div id="managerErr" class="error"></div></section>
<section id="configView" class="card hidden"><div class="top"><div><small id="configClass"></small><h2 style="margin-bottom:4px"><input id="levelName" style="font-size:1em;font-weight:800"></h2><div style="color:#5a7890">Configuration du template — même interface que l’entraînement</div></div><button class="secondary" data-back="levels">Retour</button></div><div class="cf-savebar"><div class="cf-session-bar"><label>Nombre de questions <input id="questionCount" type="number" min="1" max="500"></label><label>Durée (max) <input id="durationMinutes" type="number" min="1" max="60"> min</label></div></div><div id="configErr" class="error"></div><div id="configRows"></div></section>
</main><script src="/config-form.js?v=255"></script><script>
const $=s=>document.querySelector(s), classes=['CP','CE1','CE2','CM1','CM2'];let currentClass=null,levels=[],current=null,cfg=null,classColors={};
function renderHelpCatalog(){
  const P=window.Pedagogy, catalog=P.catalog;
  $('#helpCatalog').innerHTML=catalog.map(group=>`<article class="help-card"><h3>▼ ${group.name}</h3><div class="help-id">${group.id}</div><div class="help-tree">${group.cases.map(([title,key])=>{const pool=P.examplePools[key]||[],q=pool[0],h=q?P.contextualHelp(q):{tip:'',html:''};return `<div class="help-case"><strong>├─ ${title}</strong><div class="help-aid">${h.tip}</div><div class="help-correction"><b>Pool réellement utilisé par Aide :</b><div style="margin-top:7px;display:flex;gap:6px;flex-wrap:wrap">${pool.map(ex=>`<span style="background:white;border:1px solid #ffd49a;border-radius:8px;padding:5px 8px">${ex.display.replace('__','?')}</span>`).join('')}</div></div><div style="margin-top:8px">${h.html}</div></div>`}).join('')}</div></article>`).join('');
}


async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt}),j=await r.json();if(!r.ok)throw Error(j.error||'Erreur');return j}
function show(id){['adminHome','helpView','classesView','levelsView','managerView','configView'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id))}
async function ensureAuth(){let s=await api('/api/auth/status');if(!s.authenticated){location.href='/';return false}return true}
async function loadLevels(){levels=await api('/api/admin/levels');classColors=await api('/api/admin/class-colors')}
async function exportLevels(){
  try{
    $('#levelsTransferMsg').textContent='';
    let r=await fetch('/api/admin/levels/export');
    if(!r.ok){let j=await r.json().catch(()=>({}));throw Error(j.error||'Export impossible')}
    let blob=await r.blob(),url=URL.createObjectURL(blob),link=document.createElement('a');
    link.href=url;link.download='calcul-mental-niveaux.json';document.body.appendChild(link);link.click();link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    $('#levelsTransferMsg').textContent='Export terminé ✓';
  }catch(e){alert('Export impossible : '+e.message)}
}
async function importLevelsFile(file){
  if(!file)return;
  try{
    let text=await file.text(),data=JSON.parse(text);
    if(!confirm('Importer ce fichier remplacera tous les niveaux actuels. Continuer ?'))return;
    let result=await api('/api/admin/levels/import',{method:'POST',body:JSON.stringify(data)});
    await loadLevels();renderLevelList();
    $('#levelsTransferMsg').textContent=result.count+' niveaux importés ✓';
  }catch(e){alert('Import impossible : '+e.message)}
  finally{$('#importLevelsFile').value=''}
}
$('#exportLevels').onclick=exportLevels;
$('#importLevels').onclick=()=>$('#importLevelsFile').click();
$('#importLevelsFile').addEventListener('change',e=>importLevelsFile(e.target.files[0]));

function classButtons(){let r=$('#classes');r.innerHTML='';classes.forEach(c=>{let b=document.createElement('button');b.textContent=c;let col=classColors[c]||'#3189dc';b.style.background=col;b.style.borderColor=col;b.style.color='#fff';b.onclick=()=>openClass(c);r.appendChild(b)})}
async function openClass(c){currentClass=c;await loadLevels();$('#classTitle').textContent=c;let col=classColors[c]||'#3189dc';$('#classColor').value=col;$('#classColorPreview').style.background=col;$('#classColorSaved').textContent='';renderLevelList();show('levelsView')}
function renderLevelList(){let arr=levels.filter(x=>x.school_class===currentClass).sort((a,b)=>a.position-b.position),r=$('#levelList');r.innerHTML='';arr.forEach((x,i)=>{let d=document.createElement('div');d.className='level-item';d.innerHTML=`<button class="level-open">${x.name}</button><label class="level-active-toggle" title="Disponible pour les joueurs"><input type="checkbox" ${x.active!==0?'checked':''}> <span>Actif</span></label><button class="move" title="Monter">↑</button><button class="move" title="Descendre">↓</button><button class="danger level-delete" title="Supprimer ce niveau">Supprimer</button>`;d.children[0].onclick=()=>openConfig(x.id);let activeBox=d.querySelector('.level-active-toggle input');activeBox.onchange=async()=>{try{await api('/api/admin/levels/'+x.id+'/active',{method:'PUT',body:JSON.stringify({active:activeBox.checked})});x.active=activeBox.checked?1:0}catch(e){activeBox.checked=!activeBox.checked;alert(e.message)}};d.children[2].onclick=()=>move(x.id,'up');d.children[3].onclick=()=>move(x.id,'down');d.children[2].disabled=i===0;d.children[3].disabled=i===arr.length-1;d.children[4].onclick=async()=>{if(confirm('Supprimer « '+x.name+' » ?')){await api('/api/admin/levels/'+x.id,{method:'DELETE'});await loadLevels();renderLevelList()}};r.appendChild(d)})}
async function move(id,direction){await api('/api/admin/levels/'+id+'/move',{method:'POST',body:JSON.stringify({direction})});await openClass(currentClass)}
$('#classColor').addEventListener('input',e=>{$('#classColorPreview').style.background=e.target.value;$('#classColorSaved').textContent=''});
$('#classColor').addEventListener('change',async e=>{try{let r=await api('/api/admin/class-colors/'+currentClass,{method:'PUT',body:JSON.stringify({color:e.target.value})});classColors[currentClass]=r.color;$('#classColorSaved').textContent='Enregistré ✓';classButtons()}catch(x){$('#classColorSaved').textContent=x.message}});
$('#manageLevels').onclick=async()=>{await loadLevels();classButtons();show('classesView')};
$('#manageHelp').onclick=()=>{renderHelpCatalog();show('helpView')};
document.querySelectorAll('[data-back]').forEach(b=>b.onclick=async()=>{let x=b.dataset.back;if(x==='levels'){await loadLevels();renderLevelList()}show(x==='home'?'adminHome':x==='classes'?'classesView':'levelsView')});
$('#manageList').onclick=()=>{renderManager();show('managerView')};
function renderManager(){let sel=$('#copyFrom');sel.innerHTML='<option value="">Configuration vide</option>'+levels.map(x=>`<option value="${x.id}">${x.school_class} · ${x.name}</option>`).join('');let r=$('#managerList');r.innerHTML='';levels.filter(x=>x.school_class===currentClass).sort((a,b)=>a.position-b.position).forEach(x=>{let d=document.createElement('div');d.className='level-item';d.innerHTML=`<button class="level-open">${x.name}</button><button class="danger">Supprimer</button>`;d.children[0].onclick=()=>openConfig(x.id);d.children[1].onclick=async()=>{if(confirm('Supprimer « '+x.name+' » ?')){await api('/api/admin/levels/'+x.id,{method:'DELETE'});await loadLevels();renderManager()}};r.appendChild(d)})}
$('#addLevel').onclick=async()=>{try{let created=await api('/api/admin/levels',{method:'POST',body:JSON.stringify({school_class:currentClass,name:$('#newName').value,copy_from:$('#copyFrom').value||null})});$('#newName').value='';await loadLevels();renderManager();renderLevelList();$('#managerErr').textContent='';if(created?.id)await openConfig(created.id)}catch(e){$('#managerErr').textContent=e.message}};
async function openConfig(id){
  try{
    current=await api('/api/admin/levels/'+id);
    cfg=current.config;
    $('#configClass').textContent=current.school_class;
    $('#levelName').value=current.name;
    $('#durationMinutes').value=Math.round(cfg.duration/60);
    $('#questionCount').value=cfg.count;
    ConfigForm.render($('#configRows'),cfg);
    $('#configErr').textContent='';
    show('configView');
  }catch(e){
    const box=$('#managerErr'); if(box) box.textContent='Impossible d’ouvrir le niveau : '+e.message;
    alert('Impossible d’ouvrir le niveau : '+e.message);
  }
}
let levelSaveTimer=null,levelSaveSeq=0;
async function autoSaveLevel(){
  if(!cfg||!current)return;
  cfg.duration=Math.max(60,(+$('#durationMinutes').value||5)*60);cfg.count=Math.max(1,+$('#questionCount').value||50);ConfigForm.collect($('#configRows'),cfg);
  if(!Object.values(cfg.categories).some(v=>v.enabled)){ $('#configErr').textContent='Sélectionne au moins un type d’exercice.';return }
  const seq=++levelSaveSeq;
  try{await api('/api/admin/levels/'+current.id,{method:'PUT',body:JSON.stringify({name:$('#levelName').value,config:cfg})});if(seq===levelSaveSeq)$('#configErr').textContent=''}catch(e){if(seq===levelSaveSeq)$('#configErr').textContent='Enregistrement automatique impossible : '+e.message}
}
function scheduleLevelSave(){clearTimeout(levelSaveTimer);levelSaveTimer=setTimeout(autoSaveLevel,250)}
$('#questionCount').addEventListener('change',()=>{if(!cfg)return;cfg.count=Math.max(1,Math.min(500,+$('#questionCount').value||50));ConfigForm.render($('#configRows'),cfg);scheduleLevelSave()});
$('#durationMinutes').addEventListener('change',scheduleLevelSave);
$('#levelName').addEventListener('change',scheduleLevelSave);
$('#configRows').addEventListener('configchange',scheduleLevelSave);
(async()=>{if(await ensureAuth()){classButtons()}})();
</script></body></html>
